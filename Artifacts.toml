# The plotly.js distribution, pinned by content hash. This is deliberately the SAME artifact
# PlotlyJS.jl declares (identical tree-sha1), so a machine that already has PlotlyJS installed
# resolves it from the depot with no download, and the bytes a figure renders with are provably
# the ones that package ships. Bump both the version in the url and the hashes together.
[plotly-artifacts]
git-tree-sha1 = "2087b61e09721da0cb0c89f2f5756d5bf19ae917"

    [[plotly-artifacts.download]]
    sha256 = "4f7170fbaac6f260d115283e53e61c77491de43f795aacab63f51832ece18dac"
    url = "https://github.com/JuliaPlots/PlotlyJS.jl/releases/download/plotly-artifacts-2.35.2/plotly-artifacts-2.35.2.tar.gz"
